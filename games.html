<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games &amp; schedules · SLAM! Elementary Athletics</title>
  <meta name="description" content="Draft Fall 2026 elementary games and schedules for SLAM! Nevada Athletics.">
  <link rel="icon" type="image/svg+xml" href="assets/mark-square.svg">
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="games.css">
</head>
<body class="games-body">
  <main class="page" id="app">
    <section class="shell">
      <header class="top">
        <div class="brand">
          <img src="assets/bull-only-transparent.png" alt="SLAM! Athletics bull">
          <div class="brand-copy">
            <h1>Games</h1>
            <p class="brand-sub">Fall 2026 · Elementary</p>
          </div>
          <span class="draft-badge" title="Draft page — not the homepage promo">Draft</span>
        </div>
        <div class="top-actions">
          <nav class="page-links" aria-label="Athletics pages">
            <a href="slam-register.html">Register</a>
            <a href="slam-eligibility.html">Eligibility</a>
            <a href="slam-tryouts.html">Tryouts</a>
            <a class="active" href="games.html">Games</a>
          </nav>
          <button class="btn print-btn" type="button" id="print-btn">Print PDF</button>
        </div>
      </header>

      <section class="hero">
        <div class="eyebrow">Schedules</div>
        <div class="headline">Games &amp; schedules</div>
        <p class="lead">Elementary-only Fall 2026 NCSAA calendar. Filter by sport or team, pin SLAM games, then print a master calendar of whatever is currently on screen.</p>
      </section>

      <section class="filters" aria-label="Schedule filters">
        <div class="filter-block">
          <div class="filter-label" id="sport-filter-label">Sport</div>
          <div class="sport-chips" id="sport-filters" role="tablist" aria-labelledby="sport-filter-label"></div>
        </div>
        <div class="filter-row">
          <label class="filter-field">
            <span class="filter-label">Team</span>
            <select id="team-filter"></select>
          </label>
          <label class="slam-toggle">
            <input type="checkbox" id="slam-only">
            <span class="toggle-ui" aria-hidden="true"></span>
            <span>SLAM only</span>
          </label>
          <p class="filter-count" id="filter-count">Loading schedule…</p>
        </div>
      </section>

      <section class="board" aria-label="Upcoming elementary games">
        <div id="status" class="status" hidden></div>
        <div id="schedule" class="schedule"></div>
      </section>

      <div class="bottom-actions no-print">
        <a class="back" id="back-link" href="slam.html">← Back to homepage</a>
      </div>
    </section>
  </main>

  <div class="detail-modal" id="detail-modal" hidden>
    <button class="detail-backdrop" type="button" aria-label="Close game details"></button>
    <article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button class="detail-close" type="button" aria-label="Close">×</button>
      <div id="detail-body"></div>
    </article>
  </div>

  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <script src="games.js"></script>
</body>
</html>
